<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Paramjeet Chaudhary — Full Stack and React Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .name { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 44px; font-weight: 700; letter-spacing: 5px; fill: #ffffff; }
    .sub  { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 16px; letter-spacing: 6px; fill: #aaaaaa; }
    .cursor { fill: #ffffff; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    .fade { animation: fade 1.2s ease-out both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect width="1000" height="200" fill="#000000"/>
  <rect x="0.5" y="0.5" width="999" height="199" fill="none" stroke="#222222"/>
  <g class="fade">
    <text x="500" y="98" text-anchor="middle" class="name">PARAMJEET CHAUDHARY</text>
    <text x="500" y="134" text-anchor="middle" class="sub">FULL STACK &amp; REACT DEVELOPER</text>
    <rect class="cursor" x="493" y="150" width="14" height="3"/>
  </g>
</svg>
